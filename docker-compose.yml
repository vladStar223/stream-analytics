x-db: &db
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-analytics}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      <<: *db
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 40

  generator:
    build: ./generator
    depends_on: {clickhouse: {condition: service_healthy}}
    ports: ["127.0.0.1:9100:9100"]
    environment:
      <<: *db
      GENERATOR_BATCH_SIZE: ${GENERATOR_BATCH_SIZE:-1000}
      GENERATOR_BACKFILL_START: ${GENERATOR_BACKFILL_START:-2025-01-01T00:00:00}
      GENERATOR_BACKFILL_STEP_SECONDS: ${GENERATOR_BACKFILL_STEP_SECONDS:-60}
      GENERATOR_REALTIME_STEP_SECONDS: ${GENERATOR_REALTIME_STEP_SECONDS:-1}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.02}

  superset:
    build: ./superset
    depends_on: {clickhouse: {condition: service_healthy}}
    ports: ["127.0.0.1:8088:8088"]
    volumes: [superset_home:/app/superset_home]
    environment:
      <<: *db
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-mmorpg-demo-secret-change-before-sharing}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}

  ui:
    build: ./ui
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {clickhouse: {condition: service_healthy}}
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    environment:
      <<: *db
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-stream-analytics}

  jupyter:
    build: ./jupyter
    depends_on: {clickhouse: {condition: service_healthy}}
    ports: ["127.0.0.1:8888:8888"]
    volumes: [./notebooks:/home/jovyan/work]
    environment:
      <<: *db
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-mmorpg}

volumes:
  clickhouse_data:
    name: clickhouse_data
  superset_home:
